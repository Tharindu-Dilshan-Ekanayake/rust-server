# Builds the server image, pushes it to this repo's GitHub Container Registry and
# tells Bloxity Legion to roll it out.  dev branch -> dev channel, main -> prod.
#
# One secret: LEGION_DEPLOY_TOKEN (My Games -> modern-guns -> eye icon).
# First deploy only: make the GHCR package public (repo -> Packages ->
# modern-guns-server -> Package settings -> Change visibility), then re-run.
name: Deploy server

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-server-${{ github.ref_name }}
  cancel-in-progress: false

env:
  GAME_ID: modern-guns
  # Players one pod (1 vCPU / 512 MB) holds: four full 8-player rooms. Measured
  # (npm run test:load): 6 rooms of 8 incl. bots use ~14% of a core and ~100 MB,
  # so 4 rooms leaves plenty of headroom for a slower cloud vCPU and GC.
  # Check the pod's "[stats]" log lines before raising it.
  SEAT_CAP: 32

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Channel and image name
        id: meta
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then channel=prod; else channel=dev; fi
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$owner/$GAME_ID-server:$channel-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out on Legion
        env:
          LEGION_DEPLOY_TOKEN: ${{ secrets.LEGION_DEPLOY_TOKEN }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          curl -sS --fail-with-body -X POST "https://legion.bloxity.io/v1/apps/$GAME_ID/deploy" \
            -H "Authorization: Bearer $LEGION_DEPLOY_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"channel\":\"$CHANNEL\",\"image\":\"$IMAGE\",\"version\":\"$GITHUB_SHA\",\"seatCap\":$SEAT_CAP}"
